<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234750DD' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='m10 10-2 2 2 2'/><path d='m14 14 2-2-2-2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevDesk — All-in-One Developer Workspace</title>
    <meta name="description" content="Fast, focused workspace for software developers. Utilities, tasks, scratchpad, snippets, projects, and local-first privacy." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint (light is the default; v1 workspaces move to light once)
      try {
        var d = JSON.parse(localStorage.getItem('devdesk_workspace_v1') || '{}');
        var t = (d.version >= 2 && d.settings && d.settings.theme) || 'light';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
