<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevDesk — Global Production Developer Workspace & API Desk</title>
    <meta name="description" content="Production-grade, private, local-first developer cockpit with REST, GraphQL, WebSocket, SSE, in-browser mock server, OpenAPI explorer, and 15 utilities." />
    <meta name="theme-color" content="#4750dd" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DevDesk" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
      // Apply saved theme & locale before first paint to prevent layout flash
      try {
        var raw = localStorage.getItem('devdesk_workspace_v3') || localStorage.getItem('devdesk_workspace_v2') || localStorage.getItem('devdesk_workspace_v1');
        var d = JSON.parse(raw || '{}');
        var t = (d.settings && d.settings.theme) || 'light';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (d.settings && d.settings.locale) {
          document.documentElement.setAttribute('lang', d.settings.locale);
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <!-- Skip to main content landmark for accessibility (WCAG AA) -->
    <a href="#main-content" class="skip-to-content" style="position: absolute; left: -9999px; z-index: 9999; padding: 8px 16px; background: #4750dd; color: #fff; text-decoration: none; border-radius: 4px; font-weight: 600;">
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
