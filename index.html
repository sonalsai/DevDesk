<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevDesk — All-in-One Developer Workspace</title>
    <meta name="description" content="Fast, focused workspace for software developers. Utilities, tasks, scratchpad, snippets, projects, and local-first privacy." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint (light is the default; v1 workspaces move to light once)
      try {
        var raw = localStorage.getItem('devdesk_workspace_v3') || localStorage.getItem('devdesk_workspace_v2') || localStorage.getItem('devdesk_workspace_v1');
        var d = JSON.parse(raw || '{}');
        var t = (d.settings && d.settings.theme) || 'light';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
